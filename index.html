<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E69">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="肩評価">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>

<body><title>肩関節 初回評価ナビ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 片手操作の縦一列。上部に経過時間とステップ、下部に固定ナビ。タップ領域は最低44px */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#E2E9E7; --line:#C9D4D1;
  --ink:#15232A; --ink-2:#4A5C62;
  --accent:#0B6E69; --accent-ink:#FFFFFF; --accent-soft:#D2EBE8;
  --pos:#B4361F; --on-pos:#FFFFFF; --neg:#2F6B45; --on-neg:#FFFFFF;
  --warn:#946000; --warn-soft:#FBEBC8;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1719; --surface:#172225; --surface-2:#203034; --line:#2F4247;
  --ink:#E3ECEA; --ink-2:#98ACAF;
  --accent:#4CC2B8; --accent-ink:#06201E; --accent-soft:#163A38;
  --pos:#F08A72; --on-pos:#2A0D07; --neg:#7CC795; --on-neg:#0B2214;
  --warn:#E3B04B; --warn-soft:#3A2C0E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1719; --surface:#172225; --surface-2:#203034; --line:#2F4247;
  --ink:#E3ECEA; --ink-2:#98ACAF;
  --accent:#4CC2B8; --accent-ink:#06201E; --accent-soft:#163A38;
  --pos:#F08A72; --on-pos:#2A0D07; --neg:#7CC795; --on-neg:#0B2214;
  --warn:#E3B04B; --warn-soft:#3A2C0E; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:10px 16px 0;border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto}
.top-row{display:flex;align-items:center;gap:10px}
.app{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app small{font-weight:500;color:var(--ink-2);margin-left:6px}
.p1left{font-size:12px;color:var(--ink-2);text-align:right;line-height:1.2}
.p1left b{font-family:var(--f-num);font-size:15px;color:var(--ink)}
.timer{font-family:var(--f-num);font-size:22px;letter-spacing:.02em;min-width:4.2em;text-align:right}
.timer.t10{color:var(--warn)} .timer.t15{color:var(--pos)}
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-top:8px}
.steps button{border:0;background:none;padding:6px 0 8px;font-size:11px;color:var(--ink-2);border-top:3px solid var(--line);position:relative;min-height:36px}
.steps button.done{border-top-color:var(--accent)}
.steps button.cur{border-top-color:var(--ink);color:var(--ink);font-weight:700}
.steps button.miss::after{content:"";position:absolute;top:4px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}

/* main */
main{max-width:560px;margin:0 auto;padding-block:16px 150px;display:flex;flex-direction:column;gap:12px}
h1{font-size:22px;line-height:1.3;margin:2px 0 0;text-wrap:balance}
.lead{color:var(--ink-2);margin:0;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.field{display:flex;flex-direction:column;gap:8px}
.f-label{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.03em;display:flex;align-items:center;gap:6px}
.f-label .miss{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.sub{font-size:12.5px;color:var(--ink-2);margin:0}
.sec-title{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ink-2);margin:6px 2px -4px}

/* segmented & chips */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.seg button[aria-pressed="true"][data-tone="pos"]{background:var(--pos);border-color:var(--pos);color:var(--on-pos)}
.seg button[aria-pressed="true"][data-tone="neg"]{background:var(--neg);border-color:var(--neg);color:var(--on-neg)}
.seg.mmt button{flex:1 1 0;font-family:var(--f-num);font-size:17px;padding-inline:0}
.chips button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent);font-weight:500}
.chips button[aria-pressed="true"]::before{content:"✓ ";color:var(--accent);font-weight:700}

/* switch */
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;background:none;border:0;padding:0;text-align:left}
.sw-track{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw-knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw[aria-checked="true"] .sw-track{background:var(--accent)}
.sw[aria-checked="true"] .sw-knob{transform:translateX(22px)}

/* slider & stepper */
.sl{display:flex;flex-direction:column;gap:4px}
.sl-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.sl-head output{font-family:var(--f-num);font-size:20px;font-variant-numeric:tabular-nums}
.sl-row{display:flex;align-items:center;gap:8px}
.sl-row input[type=range]{flex:1;min-width:0;height:44px;accent-color:var(--accent);margin:0}
.sl-row input.unset{opacity:.35}
.ib{width:44px;height:44px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;line-height:1}
.stp{display:flex;align-items:center;gap:8px}
.stp .lab{flex:1;font-size:14px}
.stp output{font-family:var(--f-num);font-size:22px;min-width:2.4em;text-align:center}
.stp .unit{font-size:13px;color:var(--ink-2);min-width:2em}
.pair{display:grid;grid-template-columns:1fr;gap:12px}

input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px}
textarea{min-height:84px;resize:vertical}

/* buttons */
.btn{min-height:48px;padding:0 16px;border-radius:12px;font-weight:700;border:1px solid var(--line);background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--pos);color:var(--on-pos);border-color:var(--pos)}
.btn.small{min-height:40px;font-size:14px;padding:0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row .btn{flex:1 1 auto}
.link{background:none;border:0;color:var(--accent);font-size:14px;padding:6px 0;min-height:36px;text-decoration:underline;text-underline-offset:3px}
.big-ok{width:100%;min-height:68px;border-radius:14px;border:2px solid var(--neg);background:var(--surface);color:var(--neg);font-size:17px;font-weight:700}
.big-ok[aria-pressed="true"]{background:var(--neg);color:var(--on-neg)}

/* notices */
.note{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.note.warn{background:var(--warn-soft);border:1px solid var(--warn)}
.note.info{background:var(--accent-soft);border:1px solid var(--accent)}
.note b{font-weight:700}

/* modules */
.mod{gap:10px}
.mod.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mod-key{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-num);font-size:16px;background:var(--surface-2);flex:none}
.mod.on .mod-key{background:var(--accent);color:var(--accent-ink)}
.mod-title{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.mod-title b{display:block;font-size:16px}
.mod-title small{display:block;color:var(--ink-2);font-size:12.5px}
.why{font-size:13px;color:var(--accent);font-weight:500}
.why::before{content:"推奨  ";font-weight:700}

/* tests */
.lv-head{display:flex;align-items:center;gap:8px}
.lv{font-family:var(--f-num);font-size:13px;padding:2px 8px;border-radius:6px;background:var(--ink);color:var(--bg)}
.lv-head .cnt{margin-left:auto;font-size:14px;color:var(--ink-2)}
.test{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.t-head{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.t-name{font-weight:700;font-size:16px;margin-right:2px}
.tag{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-family:var(--f-num)}
.tag.warn{background:var(--warn-soft);color:var(--warn);font-family:var(--f-body);font-weight:700}
.t-time{margin-left:auto;font-size:12px;color:var(--ink-2)}
.t-tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.status{display:flex;align-items:center;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--surface-2);color:var(--ink-2)}
.status b{color:var(--ink)}
details.hint summary{font-size:13px;color:var(--accent);cursor:pointer;padding:4px 0;list-style:none}
details.hint summary::before{content:"▸ ";}
details.hint[open] summary::before{content:"▾ ";}
details.hint p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
.cl{display:flex;flex-direction:column;gap:6px}
.cl-row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.cl-items{display:flex;flex-wrap:wrap;gap:6px}
.cl-items span{font-size:12.5px;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
.cl-items .p{background:var(--pos);color:var(--on-pos);border-color:var(--pos)}
.cl-items .n{background:var(--surface-2)}
.cl-items .u{border-style:dashed;color:var(--ink-2)}

/* summary */
.soap{font-family:var(--f-body);font-size:13.5px;line-height:1.6;background:var(--surface-2);border:0;border-radius:10px;padding:12px;min-height:200px}
.check-row{display:flex;align-items:flex-start;gap:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px}
.check-row:first-of-type{border-top:0;padding-top:0}
.check-row div{flex:1;min-width:0}
.check-row b{display:block}
.flash{font-size:14px;font-weight:700;color:var(--neg)}

/* bottom nav */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.nav-in .primary{flex:1}
.nav-mid{font-size:12px;color:var(--ink-2);text-align:center;line-height:1.3;min-width:3.5em}
.nav-mid .w{color:var(--warn);font-weight:700}

@media (min-width:480px){.pair{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="top-in" id="top"></div></header>
<main id="main"></main>
<nav class="bottom" aria-label="ステップ移動"><div class="nav-in" id="bottom"></div></nav>

<script>
"use strict";
const KEY = "shoulder-eval-draft-v1";

const STEPS = [
  {id:"info",  label:"基本", title:"基本情報"},
  {id:"rf",    label:"確認", title:"レッドフラグの確認"},
  {id:"hx",    label:"問診", title:"問診"},
  {id:"mods",  label:"選択", title:"評価モジュールの選択"},
  {id:"core",  label:"共通", title:"共通評価"},
  {id:"tests", label:"検査", title:"モジュール別の検査"},
  {id:"smod",  label:"修正", title:"症状修正・機能評価"},
  {id:"sum",   label:"記録", title:"記録のまとめ"}
];

/* 評価モジュール。p=優先度(1-3), irr=易刺激性が高いと控える検査, t=目安秒数, o=選択肢, pos=陽性とみなす値, num=[min,max] */
const MODS = {
  A:{name:"腱板・肩峰下", sub:"腱板関連肩痛（RCRSP）", tests:[
    {id:"hawkins", n:"Hawkins-Kennedy", p:1, irr:1, t:20, h:"肩90°屈曲・肘90°屈曲位で他動的に内旋。肩峰下に痛みが出れば陽性。"},
    {id:"sdt", n:"Scapular dyskinesis test", p:2, t:40, o:["正常","軽度","明らか"], h:"1kg程度の負荷で屈曲・外転を各5回。肩甲骨内側縁の浮き上がりや早期挙上をみる。"},
    {id:"sat", n:"Scapular assistance test", p:2, t:30, o:["痛み軽減","不変"], h:"挙上時に肩甲骨の上方回旋・後傾を徒手で補助し、痛みとROMの変化をみる。"},
    {id:"neer", n:"Neer", p:3, irr:1, t:15, h:"肩甲骨を固定し、内旋位で他動的に最大挙上。"},
    {id:"thext", n:"胸椎伸展の可動性", p:3, t:30, o:["制限なし","制限あり"], pos:"制限あり", h:"座位で胸椎伸展を観察。壁から後頭部までの距離などで確認。"}
  ]},
  B:{name:"腱板断裂", sub:"外傷性・筋力低下", tests:[
    {id:"droparm", n:"Drop arm", p:1, t:20, h:"他動的に90°外転位へ挙上し、ゆっくり下ろさせる。保持できない・落下すれば陽性。"},
    {id:"erlag", n:"ER lag sign", p:1, t:20, h:"肘90°屈曲・軽度外転位で最大外旋位に保持させる。5°以上内旋方向に戻れば陽性。"},
    {id:"jobe", n:"Jobe（Empty can）", p:2, t:20, h:"肩甲骨面90°挙上・母指下向きで下方へ抵抗。筋力低下・痛みをみる。"},
    {id:"belly", n:"Belly press", p:2, t:15, h:"手掌で腹部を押させる。肘が後方に引ければ陽性（肩甲下筋）。"},
    {id:"liftoff", n:"Lift-off", p:2, irr:1, t:15, h:"手背を腰部に当て、背部から離させる。離せなければ陽性。"},
    {id:"bearhug", n:"Bear hug", p:3, t:15, h:"手掌を反対側の肩に置かせ、引き離す抵抗に抗させる。"},
    {id:"hornblower", n:"Hornblower", p:3, t:15, h:"肩甲骨面90°外転位で外旋抵抗。保持できなければ陽性（小円筋）。"}
  ]},
  C:{name:"拘縮", sub:"凍結肩・変形性肩関節症", tests:[
    {id:"endfeel", n:"エンドフィール（外旋）", p:1, t:15, o:["関節包性","軟部組織性","虚性（empty）"]},
    {id:"stage", n:"病期", p:2, t:10, o:["疼痛期","拘縮期","回復期"], h:"易刺激性と経過期間から判断する。"},
    {id:"crep", n:"轢音", p:2, t:10, o:["あり","なし"], pos:"あり"},
    {id:"xray", n:"X線の確認", p:3, t:10, o:["異常なし","OA所見","未確認"]}
  ]},
  D:{name:"不安定症・関節唇", sub:"脱臼既往・オーバーヘッド", tests:[
    {id:"appre", n:"Apprehension", p:1, irr:1, t:20, h:"背臥位90°外転位から外旋。不安感が出れば陽性（痛みのみは陰性）。"},
    {id:"reloc", n:"Relocation / Surprise", p:1, t:20, h:"骨頭を後方へ押さえると不安感が消え、離すと再び出れば陽性。"},
    {id:"sulcus", n:"Sulcus sign", p:1, t:15, o:["陰性","1+","2+","3+"], h:"下垂位で上肢を下方へ牽引。肩峰下の陥凹が1cm未満=1+、1–2cm=2+、2cm超=3+。"},
    {id:"loadshift", n:"Load & shift", p:2, t:20, o:["Grade 0","1","2","3"]},
    {id:"beighton", n:"Beighton score", p:2, t:40, num:[0,9], unit:"/9"},
    {id:"obrienD", n:"O'Brien（関節唇）", p:2, t:20, h:"90°屈曲・10°水平内転・母指下向きで下方抵抗。手掌上向きで深部痛が軽減すれば陽性。"},
    {id:"jerk", n:"Jerk", p:3, irr:1, t:20, h:"90°屈曲・内旋位で軸圧をかけて水平内転。クリック・痛みで陽性（後下方）。"},
    {id:"kim", n:"Kim", p:3, irr:1, t:20, h:"座位90°外転位で軸圧をかけながら斜め下方へ。痛みで陽性（後下方関節唇）。"},
    {id:"ckcuest", n:"CKCUEST", p:3, t:30, num:[0,40], unit:"回"}
  ]},
  E:{name:"AC関節", sub:"肩上部の限局痛", tests:[
    {id:"actender", n:"AC関節の圧痛", p:1, t:10},
    {id:"crossbody", n:"Cross-body adduction", p:1, t:15, h:"90°屈曲位で他動的に水平内転。AC関節部に痛みが出れば陽性。"},
    {id:"obrienE", n:"O'Brien（AC）", p:2, t:20, h:"母指下向きの抵抗で肩上部（AC関節部）に痛みが出れば陽性。"},
    {id:"paxinos", n:"Paxinos", p:2, t:15, h:"肩峰後外側を前上方へ、鎖骨中央を下方へ圧迫。"}
  ]},
  F:{name:"頸椎", sub:"神経根症・関連痛", tests:[
    {id:"spurling", n:"Spurling", p:1, irr:1, t:20, h:"頸椎を患側へ側屈・軽度伸展し軸圧。上肢への放散痛で陽性。"},
    {id:"distr", n:"Distraction", p:1, t:15, h:"背臥位で頸椎を牽引。上肢症状が軽減すれば陽性。"},
    {id:"ultta", n:"ULTT A（正中神経）", p:1, t:40, h:"肩甲帯下制→外転→前腕回外・手関節伸展→肘伸展→頸部側屈。症状再現と左右差をみる。"},
    {id:"cvrot", n:"頸椎回旋（患側）", p:1, t:15, o:["60°以上","60°未満"], pos:"60°未満"},
    {id:"neuroM", n:"筋力（C5–C7）", p:2, t:40, o:["正常","低下"], pos:"低下"},
    {id:"neuroS", n:"感覚（C5–C7）", p:2, t:30, o:["正常","低下"], pos:"低下"},
    {id:"neuroR", n:"腱反射（BTR・BrR・TTR）", p:2, t:30, o:["正常","低下","亢進"]},
    {id:"roos", n:"Roos（胸郭出口）", p:3, t:60}
  ]},
  G:{name:"術後", sub:"プロトコルに沿った確認", tests:[
    {id:"wound", n:"創部", p:1, t:15, o:["良好","発赤・腫脹","滲出"]},
    {id:"axillary", n:"腋窩神経（三角筋外側の感覚）", p:1, t:10, o:["正常","低下"], pos:"低下"},
    {id:"contraok", n:"禁忌肢位の確認", p:1, t:10, o:["確認済み"]},
    {id:"distalrom", n:"肘・手指のROM", p:2, t:20, o:["正常","制限あり"], pos:"制限あり"},

function merge(base, src){
  for (const k in src){
    if (src[k] && typeof src[k]==="object" && !Array.isArray(src[k]) && base[k] && typeof base[k]==="object" && !Array.isArray(base[k])) merge(base[k], src[k]);
    else base[k] = src[k];
  }
  return base;
}
function load(){ try{ const t = localStorage.getItem(KEY); return t ? merge(blank(), JSON.parse(t)) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function gp(p){ return p.split(".").reduce((o,k)=> o==null ? undefined : o[k], S); }
function sp(p,v){ const ks=p.split("."); let o=S; for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null) o[ks[i]]={}; o=o[ks[i]]; } o[ks[ks.length-1]]=v; }
function H(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- rules ---------- */
function suggest(st){
  const h = st.hx, r = {};
  const add = (k,why)=>{ (r[k] = r[k] || []).push(why); };
  const over40 = h.age==="40–59" || h.age==="60以上";
  if (st.info.postop || h.onset==="術後") add("G","術後");
  if (h.loc.includes("三角筋部")) add("A","三角筋部に痛み");
  if (over40 && h.onset==="非外傷性") add("A","40歳以上・非外傷性");
  if (over40 && h.onset==="外傷性") add("B","40歳以上・外傷性");
  if (h.chief.includes("力が入らない")) add("B","主訴：力が入らない");
  if (h.chief.includes("硬さ")) add("C","主訴：硬さ");
  if (h.bg.includes("糖尿病・甲状腺疾患")) add("C","糖尿病・甲状腺疾患");
  if (h.bg.includes("脱臼の既往")) add("D","脱臼の既往");
  if (h.chief.includes("外れそう")) add("D","主訴：外れそう");
  if (h.loc.includes("AC関節部")) add("E","AC関節部に痛み");
  if (h.loc.includes("肘より遠位")) add("F","肘より遠位に放散");
  if (h.loc.includes("肩甲帯・頸部")) add("F","肩甲帯・頸部に痛み");
  if (h.chief.includes("重苦感") && (h.loc.includes("肩甲帯・頸部") || h.loc.includes("肘より遠位"))) add("F","重苦感＋頸部・肩甲帯または遠位の症状");
  if (!Object.keys(r).length) add("A","既定（該当する条件なし）");
  return r;
}
function applySuggest(st){
  const sg = suggest(st);
  const order = ["G","B","D","C","E","A","F"];
  let primary = null, best = -1;
  order.forEach(k=>{ if (sg[k] && sg[k].length > best){ best = sg[k].length; primary = k; } });
  st.mods = {}; st.modSkip = {};
  MOD_KEYS.forEach(k=>{ st.mods[k] = {on:!!sg[k], role: k===primary ? "主" : "副"}; });
  st.modsInit = true;
}
function testList(){
  const out = [];
  MOD_KEYS.forEach(k=>{
    const m = S.mods[k]; if (!m || !m.on) return;
    MODS[k].tests.forEach(t=>{
      const lv = t.p + (m.role==="副" ? 1 : 0);
      if (lv <= 3) out.push(Object.assign({mod:k, lv}, t));
    });
  });
  return out;
}
const isSkip = v => typeof v==="string" && v.indexOf("skip:")===0;
const isResult = v => v!=null && v!=="" && v!=="next" && !isSkip(v);
function tone(t,v){ if (v===(t.pos||"陽性")) return "pos"; if (NEG_WORDS.includes(v)) return "neg"; return ""; }
function testPos(id){ const v = S.res[id]; if (!isResult(v)) return null; return v===(TEST[id].pos||"陽性"); }
const arcPos = ()=> S.core.arc==null ? null : S.core.arc==="陽性";
const erWeak = ()=> S.core.mmt.er==null ? null : S.core.mmt.er<=4;
const CLUSTERS = [
  {mod:"A", name:"Park cluster（インピンジメント）", items:[["Hawkins-Kennedy",()=>testPos("hawkins")],["Painful arc",arcPos],["外旋筋力 MMT4以下",erWeak]]},
  {mod:"B", name:"全層断裂のcluster", items:[["Painful arc",arcPos],["Drop arm",()=>testPos("droparm")],["外旋筋力 MMT4以下",erWeak]]},
  {mod:"F", name:"Wainner cluster（頸椎神経根症）", items:[["Spurling",()=>testPos("spurling")],["Distraction",()=>testPos("distr")],["ULTT A",()=>testPos("ultta")],["頸椎回旋60°未満",()=>testPos("cvrot")]]}
];
function clusterStat(cl){
  const vals = cl.items.map(([n,f])=>[n,f()]);
  return {vals, pos:vals.filter(x=>x[1]===true).length, und:vals.filter(x=>x[1]==null).length, total:vals.length};
}

function missing(id){
  const i=S.info, h=S.hx, c=S.core, r=c.rom, m=[];
  const chk = (cond,label)=>{ if (cond) m.push(label); };
  if (id==="info"){ chk(!i.side,"患側"); chk(!i.dom,"利き手との関係"); if (i.postop){ chk(!i.op,"術式"); chk(i.opWeeks==null,"術後週数"); } }
  if (id==="rf") chk(!S.rf.cleared && !S.rf.items.length,"レッドフラグの確認");
  if (id==="hx"){ chk(!h.age,"年齢帯"); chk(!h.onset,"発症様式"); chk(!h.dur,"経過期間"); chk(!h.loc.length,"疼痛部位"); chk(!h.chief.length,"主訴"); chk(!h.irr,"易刺激性"); chk(h.nrs==null,"NRS"); }
  if (id==="mods") chk(!MOD_KEYS.some(k=>S.mods[k] && S.mods[k].on),"評価モジュール");
  if (id==="core"){
    chk(!c.insp.length,"視診"); chk(!c.neck,"頸椎AROM");
    chk(h.chief.includes("重苦感") && !c.heavy,"重苦感の再現");
    chk(r.flexA==null,"自動屈曲"); chk(r.flexP==null,"他動屈曲"); chk(r.abdA==null,"自動外転");
    chk(r.erA==null,"自動外旋"); chk(r.erP==null,"他動外旋"); chk(r.erN==null,"健側の他動外旋"); chk(!r.ir,"結帯");
    chk(!c.arc,"Painful arc"); chk(c.mmt.er==null,"外旋筋力"); chk(c.mmt.abd==null,"外転筋力");
  }
  if (id==="tests") testList().filter(t=>t.lv===1 && S.res[t.id]==null).forEach(t=>m.push(t.n));
  if (id==="smod") chk(!S.smod.mode,"症状修正の実施・スキップ");
  return m;
}

function field(label, inner, miss){

}
function seg(path, opts, toneFn, keep, cls){
  const cur = gp(path);
  return `<div class="seg ${cls||""}">${opts.map(o=>{
    const n = typeof o==="number";
    return `<button type="button" data-act="set" data-path="${path}" data-val="${H(o)}"${n?' data-type="n"':""}${keep?' data-keep="1"':""} aria-pressed="${cur===o}"${toneFn?` data-tone="${toneFn(o)}"`:""}>${H(o)}</button>`;
  }).join("")}</div>`;
}
function chips(path, opts, excl){
  const cur = gp(path) || [];
  return `<div class="seg chips">${opts.map(o=>`<button type="button" data-act="tog" data-path="${path}" data-val="${H(o)}"${excl?` data-excl="${H(excl)}"`:""} aria-pressed="${cur.includes(o)}">${H(o)}</button>`).join("")}</div>`;
}
function sw(attrs, checked, labelHtml){
  return `<button type="button" class="sw" role="switch" aria-checked="${!!checked}" ${attrs}>${labelHtml}<span class="sw-track"><span class="sw-knob"></span></span></button>`;
}
function slider(path, label, min, max, step, unit, def){
  const v = gp(path);
  const inc = d => `data-act="inc" data-path="${path}" data-d="${d}" data-min="${min}" data-max="${max}" data-def="${def}"`;
  return `<div class="sl">
    <div class="sl-head"><span>${label}</span><output data-out="${path}">${v==null?"—":v+unit}</output></div>
    <div class="sl-row">
      <button type="button" class="ib" ${inc(-step)} aria-label="${label}を減らす">−</button>
      <input type="range" id="r-${path}" min="${min}" max="${max}" step="${step}" value="${v==null?def:v}" data-range="${path}" data-unit="${unit}" class="${v==null?"unset":""}" aria-label="${label}">
      <button type="button" class="ib" ${inc(step)} aria-label="${label}を増やす">＋</button>
    </div></div>`;
}
function stepper(path, label, min, max, unit, def){
  const v = gp(path);
  const inc = d => `data-act="inc" data-path="${path}" data-d="${d}" data-min="${min}" data-max="${max}" data-def="${def}"`;
  return `<div class="stp">${label?`<span class="lab">${label}</span>`:""}
    <button type="button" class="ib" ${inc(-1)} aria-label="減らす">−</button>
    <output>${v==null?"—":v}</output><span class="unit">${unit}</span>
    <button type="button" class="ib" ${inc(1)} aria-label="増やす">＋</button></div>`;
}

    <div class="pair">
      ${slider("core.rom.erA","下垂位外旋（自動）",-30,90,5,"°",40)}
      ${slider("core.rom.erP","下垂位外旋（他動）",-30,90,5,"°",50)}
    </div>
    ${slider("core.rom.erN","健側の下垂位外旋（他動）",-30,90,5,"°",60)}
    ${field("結帯（母指の到達レベル）", seg("core.rom.ir",["臀部","仙骨","L3","L1","Th12","Th7"]), !r.ir)}
  </div>
  ${hints.map(h=>{
    const added = S.mods[h.k] && S.mods[h.k].on;
    return `<div class="note info"><div>${h.t}</div><div>${added?`<b>${h.k}は選択済みです</b>`:`<button type="button" class="btn small primary" data-act="addmod" data-k="${h.k}">${h.k}（${MODS[h.k].name}）を副として追加</button>`}</div></div>`;
  }).join("")}
  <div class="card">
    ${field("Painful arc", seg("core.arc",["陽性","陰性"], v=>v==="陽性"?"pos":"neg"), !c.arc)}
    ${c.arc==="陽性" ? field("痛みの出る範囲", seg("core.arcRange",["60°未満","60–120°","120°以上"])) : ""}
  </div>
  <div class="sec-title">筋力（MMT）</div>
  <div class="card">
    ${field("外旋", seg("core.mmt.er",[0,1,2,3,4,5],null,false,"mmt"), m.er==null)}
    ${sw('data-act="bool" data-path="core.mmt.erPain"', m.erPain, "<span>外旋で疼痛あり</span>")}
    ${field("外転", seg("core.mmt.abd",[0,1,2,3,4,5],null,false,"mmt"), m.abd==null)}
    ${sw('data-act="bool" data-path="core.mmt.abdPain"', m.abdPain, "<span>外転で疼痛あり</span>")}
  </div>`;
}
function testRow(t){
  const v = S.res[t.id];
  const irrHigh = t.irr && S.hx.irr==="高";
  let ctrl;
  if (isSkip(v)) ctrl = `<div class="status"><span>スキップ：<b>${H(v.slice(5))}</b></span><button type="button" class="link" data-act="clearres" data-id="${t.id}">取り消す</button></div>`;
  else if (v==="next") ctrl = `<div class="status"><span><b>次回の評価へ</b></span><button type="button" class="link" data-act="clearres" data-id="${t.id}">取り消す</button></div>`;
  else if (t.num) ctrl = stepper(`res.${t.id}`,"",t.num[0],t.num[1],t.unit||"",0);
  else ctrl = seg(`res.${t.id}`, t.o||["陽性","陰性"], o=>tone(t,o));
  const tools = (!isSkip(v) && v!=="next") ? `<div class="t-tools">
      <button type="button" class="link" data-act="skipopen" data-id="${t.id}">スキップ…</button>
      ${t.h ? `<details class="hint" data-hint="${t.id}" ${UI.hints.has(t.id)?"open":""}><summary>手技</summary><p>${H(t.h)}</p></details>` : ""}
    </div>
    ${UI.openSkip===t.id ? `<div class="seg chips">${SKIP_REASONS.map(r=>`<button type="button" data-act="skipset" data-id="${t.id}" data-val="${r}" aria-pressed="false">${r}</button>`).join("")}</div>` : ""}` : "";
  return `<div class="test">
    <div class="t-head"><span class="t-name">${H(t.n)}</span><span class="tag">${t.mod}</span>${irrHigh?'<span class="tag warn">⚠ 易刺激性高</span>':""}<span class="t-time num">${t.t}秒</span></div>
    ${ctrl}${tools}</div>`;
}
function lvSection(lv, list){
  const ts = list.filter(t=>t.lv===lv);
  if (!ts.length) return "";
  const done = ts.filter(t=>S.res[t.id]!=null).length;
  return `<section class="card">
    <div class="lv-head"><span class="lv">P${lv}</span><b>${["","必須","推奨","時間があれば"][lv]}</b><span class="cnt num">${done}/${ts.length}</span></div>
    ${ts.map(testRow).join("")}</section>`;
}
function gate(nextLv, list){
  const rest = list.filter(t=>t.lv>=nextLv).length;
  if (!rest) return "";
  return `<div class="card"><div class="row">
    <button type="button" class="btn primary" data-act="level" data-n="${nextLv}">P${nextLv}に進む</button>
    <button type="button" class="btn" data-act="endhere">ここで終える（残り${rest}件は次回へ）</button></div></div>`;
}
function rTests(){
  const list = testList();
  if (!list.length) return `<h1>モジュール別の検査</h1><div class="note warn">評価モジュールが選ばれていません。<button type="button" class="btn small" data-act="goto" data-i="3">モジュールを選ぶ</button></div>`;
  const el = S.startedAt ? (Date.now()-S.startedAt)/1000 : 0;
  const pending2 = list.filter(t=>t.lv>=2 && S.res[t.id]==null).length;
  const cls = CLUSTERS.filter(c=>S.mods[c.mod] && S.mods[c.mod].on);
  let html = `<h1>モジュール別の検査</h1>
  <p class="lead">P1から順に入力します。もう一度同じボタンを押すと取り消せます。</p>`;
  if (S.hx.irr==="高") html += `<div class="note warn"><b>易刺激性：高</b><div>最終域で痛みを誘発する検査は、最初からスキップにしてあります。実施する場合は「取り消す」を押してください。</div></div>`;
  if (el>=600 && pending2) html += `<div class="note warn"><b>10分を過ぎました</b><div>P2以降の未入力${pending2}件を次回の評価に回しますか？</div><div><button type="button" class="btn small" data-act="defer">次回に回す</button></div></div>`;
  if (cls.length) html += `<div class="card">${cls.map(c=>{
    const s = clusterStat(c);
    return `<div class="cl"><div class="cl-row"><b>${c.name}</b><span class="num">陽性 ${s.pos}/${s.total}${s.und?`　未実施 ${s.und}`:""}</span></div>
      <div class="cl-items">${s.vals.map(([n,v])=>`<span class="${v===true?"p":v===false?"n":"u"}">${H(n)}</span>`).join("")}</div></div>`;
  }).join("")}<p class="sub">陽性の件数のみを記録します。解釈は記録のA欄に記入してください。</p></div>`;
  html += lvSection(1, list);
  if (S.level<2) html += gate(2, list);
  if (S.level>=2){ html += lvSection(2, list); if (S.level<3) html += gate(3, list); }
  if (S.level>=3) html += lvSection(3, list);
  return html;
}
function rSmod(){
  const s = S.smod;
  return `<h1>症状修正・機能評価</h1>
  <p class="lead">徒手的な補助で症状が変わるかを確認します。治療方針を決める手がかりになります。</p>
  <div class="card">${field("このステップ", seg("smod.mode",["実施する","スキップ"]), !s.mode)}
    ${s.mode==="スキップ" ? field("スキップの理由", seg("smod.skip",["時間","易刺激性高","対象動作なし","次回実施"]), !s.skip) : ""}
  </div>
  ${s.mode==="実施する" ? `
  <div class="card">
    ${field("対象動作", seg("smod.motion",["挙上","外転","結髪","結帯","外旋"]), !s.motion)}
    ${slider("smod.pre","補助なしのNRS",0,10,1,"",S.hx.nrs==null?5:S.hx.nrs)}
  </div>
  <div class="card">
    ${TECH.map(t=>field(t.n, seg(`smod.items.${t.id}`,["改善","不変","増悪"], v=>v==="改善"?"neg":v==="増悪"?"pos":""))).join("")}
  </div>
  <div class="card">${slider("smod.post","最も効果のあった手技でのNRS",0,10,1,"",3)}</div>` : ""}`;
}
function untested(){
  const out = testList().filter(t=>S.res[t.id]==null || S.res[t.id]==="next").map(t=>t.n);
  return missing("core").concat(out);
}
function skippedList(){
  const out = [];
  const sg = suggest(S);
  MOD_KEYS.forEach(k=>{ if (sg[k] && !(S.mods[k] && S.mods[k].on)) out.push(`${k} ${MODS[k].name}モジュール（${S.modSkip[k]||"理由未選択"}）`); });
  testList().forEach(t=>{ const v=S.res[t.id]; if (isSkip(v)) out.push(`${t.n}（${v.slice(5)}）`); });
  if (S.smod.mode==="スキップ") out.push(`症状修正（${S.smod.skip||"理由未選択"}）`);
  return out;
}
function soapText(){
  const i=S.info, h=S.hx, c=S.core, r=c.rom, m=c.mmt;
  const f = v => v==null || v==="" ? "—" : v;
  const d = new Date();
  const ds = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
  const L = [];
  L.push(`【肩関節 初回評価】${ds}　ID:${f(i.pid)}　${f(i.side)}肩（${f(i.dom)}）`);
  if (S.startedAt) L.push(`評価時間：${fmtT()}`);
  if (i.postop) L.push(`術後：${f(i.op)}　術後${f(i.opWeeks)}週　禁忌・制限：${i.contra.join("・")||"なし"}`);
  L.push(`S: ${f(h.onset)}、経過${f(h.dur)}。疼痛部位：${h.loc.join("・")||"—"}。主訴：${h.chief.join("・")||"—"}。背景：${h.bg.join("・")||"特記なし"}。NRS ${f(h.nrs)}/10。易刺激性：${f(h.irr)}`);
  if (S.rf.items.length) L.push(`   レッドフラグ：医師へ確認（${S.rf.items.join("・")}）`);
  else L.push(`   レッドフラグ：${S.rf.cleared?"医師の診察済み・該当なし":"未確認"}`);
  L.push(`O: 視診：${c.insp.join("・")||"—"}`);
  L.push(`   頸椎AROMでの症状再現：${c.neck==="再現あり"?"あり":c.neck==="再現なし"?"なし":"—"}`);
  if (h.chief.includes("重苦感")) L.push(`   重苦感の再現：${f(c.heavy)}${c.heavyMs.length?`（${c.heavyMs.join("・")}）`:""}`);
  L.push(`   ROM（自動/他動）：屈曲 ${f(r.flexA)}/${f(r.flexP)}°、外転 ${f(r.abdA)}°（自動）、下垂位外旋 ${f(r.erA)}/${f(r.erP)}°（健側 ${f(r.erN)}°）、結帯 ${f(r.ir)}`);
  L.push(`   Painful arc：${f(c.arc)}${c.arc==="陽性"&&c.arcRange?`（${c.arcRange}）`:""}`);
  L.push(`   筋力（MMT）：外旋 ${f(m.er)}${m.erPain?"（疼痛あり）":""}、外転 ${f(m.abd)}${m.abdPain?"（疼痛あり）":""}`);
  const list = testList();
  MOD_KEYS.forEach(k=>{
    const done = list.filter(t=>t.mod===k && isResult(S.res[t.id]));
    if (done.length) L.push(`   [${k} ${MODS[k].name}] ` + done.map(t=>`${t.n} ${S.res[t.id]}${t.num?(t.unit||""):""}`).join("、"));
  });
  CLUSTERS.filter(cl=>S.mods[cl.mod] && S.mods[cl.mod].on).forEach(cl=>{
    const s = clusterStat(cl);
    L.push(`   ${cl.name}：${s.total}項目中 陽性${s.pos}${s.und?`（未実施${s.und}）`:""}`);
  });
  if (S.smod.mode==="実施する"){
    const items = TECH.filter(t=>S.smod.items[t.id]).map(t=>`${t.n} ${S.smod.items[t.id]}`);
    L.push(`   症状修正（対象動作：${f(S.smod.motion)}）：${items.join("、")||"—"}　NRS ${f(S.smod.pre)}→${f(S.smod.post)}`);
  }
  L.push(`A: ${S.ap.a}`);
  L.push(`P: ${S.ap.p}`);
  const un = untested(); if (un.length) L.push(`【未実施（次回の評価へ）】${un.join("、")}`);
  const sk = skippedList(); if (sk.length) L.push(`【スキップ】${sk.join("、")}`);
  return L.join("\n");
}
function clearConfirm(){
  return `<div class="note warn"><b>入力中の記録を消去します。</b><div>記録をコピーしていない場合は、先にコピーしてください。</div>
    <div class="row"><button type="button" class="btn danger" data-act="clear">消去する</button><button type="button" class="btn" data-act="cancelclear">やめる</button></div></div>`;
}
function rSum(){
  const rows = STEPS.slice(0,7).map((st,i)=>({st,i,m:missing(st.id)})).filter(x=>x.m.length);
  const txt = soapText();
  return `<h1>記録のまとめ</h1>
  <p class="lead">A（アセスメント）とP（計画）を記入し、記録をコピーして電子カルテに貼り付けてください。</p>
  <div class="card">
    <div class="f-label">記録前のチェック</div>
    ${rows.length ? rows.map(x=>`<div class="check-row"><div><b>${x.st.title}</b><span class="sub">${H(x.m.join("、"))}</span></div><button type="button" class="btn small" data-act="goto" data-i="${x.i}">移動</button></div>`).join("")
      : `<div class="sub">未入力の項目はありません。</div>`}
  </div>
  <div class="card">
    ${field("A：アセスメント", `<textarea id="ap-a" data-text="ap.a" placeholder="病態の解釈、問題点など">${H(S.ap.a)}</textarea>`)}
    ${field("P：計画", `<textarea id="ap-p" data-text="ap.p" placeholder="治療方針、次回の再評価項目など">${H(S.ap.p)}</textarea>`)}
  </div>
  <div class="card">
    <div class="f-label">記録（SOAP）</div>
    <textarea id="soapText" class="soap" readonly rows="${txt.split("\n").length+2}">${H(txt)}</textarea>
    ${UI.flash ? `<div class="flash" role="status">${H(UI.flash)}</div>` : ""}
    <div class="row"><button type="button" class="btn primary" data-act="copy">記録をコピー</button></div>
  </div>
  <div class="card">${UI.confirmClear ? clearConfirm() : `<button type="button" class="btn" data-act="newpt">この症例を終えて消去する</button>`}</div>`;
}

/* ---------- frame ---------- */
function fmtT(){
  if (!S.startedAt) return "--:--";
  const s = Math.max(0, Math.floor((Date.now()-S.startedAt)/1000));
  return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
}
function timerCls(){ if (!S.startedAt) return ""; const s=(Date.now()-S.startedAt)/1000; return s>=900?"t15":s>=600?"t10":""; }
function renderTop(){
  const p1 = testList().filter(t=>t.lv===1);
  const left = p1.filter(t=>S.res[t.id]==null).length;
  document.getElementById("top").innerHTML = `
    <div class="top-row">
      <div class="app">肩関節 初回評価${S.info.side?`<small>${S.info.side}肩</small>`:""}</div>
      ${p1.length ? `<div class="p1left">P1 残り<br><b>${left}</b></div>` : ""}
      <div id="timer" class="timer ${timerCls()}" aria-label="経過時間">${fmtT()}</div>
    </div>
    <div class="steps">${STEPS.map((st,i)=>{
      const c = i===S.step ? "cur" : i<S.step ? "done" : "";
      const m = i<S.step && i<7 && missing(st.id).length ? " miss" : "";
      return `<button type="button" class="${c}${m}" data-act="goto" data-i="${i}" aria-current="${i===S.step?"step":"false"}">${st.label}</button>`;
    }).join("")}</div>`;
}
function renderBottom(){
  const i = S.step, miss = i<7 ? missing(STEPS[i].id).length : 0;
  document.getElementById("bottom").innerHTML = `
    <button type="button" class="btn" data-act="prev" ${i===0?"disabled":""}>戻る</button>
    <div class="nav-mid"><span class="num">${i+1}/${STEPS.length}</span>${miss?`<br><span class="w">未入力 ${miss}</span>`:""}</div>
    ${i<STEPS.length-1
      ? `<button type="button" class="btn primary" data-act="next">次へ：${STEPS[i+1].title}</button>`
      : `<button type="button" class="btn primary" data-act="copy">記録をコピー</button>`}`;
}
function render(){
  const fn = {info:rInfo, rf:rRf, hx:rHx, mods:rMods, core:rCore, tests:rTests, smod:rSmod, sum:rSum}[STEPS[S.step].id];
  const banner = S.sample ? `<div class="note info"><b>サンプル症例を表示しています</b><div>入力の流れを確認するための架空の症例です。</div><div><button type="button" class="btn small primary" data-act="newpt">新しい患者で始める</button></div></div>` : "";
  document.getElementById("main").innerHTML = banner + fn();
  renderTop(); renderBottom();
}
function onEnter(id){
  if (id==="mods" && !S.modsInit) applySuggest(S);
  if (id==="tests" && S.hx.irr==="高") testList().forEach(t=>{ if (t.irr && S.res[t.id]==null) S.res[t.id] = "skip:易刺激性高"; });
}
function goStep(i){
  i = Math.max(0, Math.min(STEPS.length-1, i));
  if (!S.startedAt && i>0) S.startedAt = Date.now();
  S.step = i; UI.openSkip = null; UI.confirmClear = false; UI.flash = "";
  onEnter(STEPS[i].id);
  save(); render(); window.scrollTo(0,0);
}
function refreshSoap(){ const ta = document.getElementById("soapText"); if (ta) ta.value = soapText(); }
function doCopy(){
  const txt = soapText();
  const done = msg => { UI.flash = msg; if (STEPS[S.step].id!=="sum") goStep(7); else render(); setTimeout(()=>{ UI.flash=""; if (STEPS[S.step].id==="sum") render(); }, 5000); };
  const fail = () => { done("自動でコピーできませんでした。記録欄を長押しして全選択し、コピーしてください。"); const ta=document.getElementById("soapText"); if (ta){ ta.focus(); ta.select(); } };
  try { navigator.clipboard.writeText(txt).then(()=>done("コピーしました。電子カルテに貼り付けてください。"), fail); } catch(e){ fail(); }
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, p = b.dataset.path;
  switch (a){
    case "next": return goStep(S.step+1);
    case "prev": return goStep(S.step-1);
    case "goto": return goStep(Number(b.dataset.i));
    case "copy": return doCopy();
    case "set": {
      const v = b.dataset.type==="n" ? Number(b.dataset.val) : b.dataset.val;
      sp(p, (gp(p)===v && !b.dataset.keep) ? null : v);
      if (p==="hx.onset") S.info.postop = gp(p)==="術後";
      break;
    }
    case "tog": {
      const v = b.dataset.val, ex = b.dataset.excl;
      let arr = (gp(p)||[]).slice();
      if (arr.includes(v)) arr = arr.filter(x=>x!==v);
      else if (ex && v===ex) arr = [v];
      else { arr = arr.filter(x=>x!==ex); arr.push(v); }
      sp(p, arr); break;
    }
    case "bool": {
      sp(p, !gp(p));
      if (p==="info.postop"){ if (S.info.postop) S.hx.onset = "術後"; else if (S.hx.onset==="術後") S.hx.onset = null; }
      break;
    }
    case "inc": {
      const min=Number(b.dataset.min), max=Number(b.dataset.max), d=Number(b.dataset.d);
      const cur = gp(p);
      sp(p, Math.max(min, Math.min(max, cur==null ? Number(b.dataset.def) : cur+d)));
      break;
    }
    case "mod": {
      const k = b.dataset.k, m = S.mods[k] || {on:false, role:"副"};
      m.on = !m.on; S.mods[k] = m; break;
    }
    case "addmod": S.mods[b.dataset.k] = {on:true, role:"副"}; break;
    case "reapply": applySuggest(S); break;
    case "skipopen": UI.openSkip = UI.openSkip===b.dataset.id ? null : b.dataset.id; break;
    case "skipset": S.res[b.dataset.id] = "skip:"+b.dataset.val; UI.openSkip = null; break;
    case "clearres": delete S.res[b.dataset.id]; break;
    case "level": S.level = Number(b.dataset.n); break;
    case "endhere": testList().forEach(t=>{ if (t.lv>S.level && S.res[t.id]==null) S.res[t.id]="next"; }); return goStep(S.step+1);
    case "defer": testList().forEach(t=>{ if (t.lv>=2 && S.res[t.id]==null) S.res[t.id]="next"; }); break;
    case "sample": S = sample(); return goStep(S.step);
    case "newpt": if (S.sample){ S = blank(); return goStep(0); } UI.confirmClear = true; break;
    case "cancelclear": UI.confirmClear = false; break;
    case "clear": S = blank(); UI.confirmClear = false; return goStep(0);
  }
  save(); render();
});
document.addEventListener("input", e=>{
  const t = e.target;
  if (t.dataset.range){
    const v = Number(t.value);
    sp(t.dataset.range, v); t.classList.remove("unset");
    const o = document.querySelector(`[data-out="${t.dataset.range}"]`);
    if (o) o.textContent = v + (t.dataset.unit||"");
    save();
  } else if (t.dataset.text){
    sp(t.dataset.text, t.value); save(); refreshSoap();
  }
});
document.addEventListener("change", e=>{ if (e.target.dataset.range) render(); });
document.addEventListener("toggle", e=>{
  const d = e.target; if (!d.dataset || !d.dataset.hint) return;
  if (d.open) UI.hints.add(d.dataset.hint); else UI.hints.delete(d.dataset.hint);
}, true);
setInterval(()=>{ const el = document.getElementById("timer"); if (el){ el.textContent = fmtT(); el.className = "timer " + timerCls(); } }, 1000);

onEnter(STEPS[S.step].id);
render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
